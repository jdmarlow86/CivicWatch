name: Deploy CivicWatch to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "civicwatch-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download Tennessee TAG expenditure data
        run: npm run data:download -- 2025

      - name: Normalize Tennessee TAG expenditure data
        run: npm run data:import

      - name: Publish normalized data to the Pages bundle
        run: mkdir -p public/data/normalized && cp data/normalized/tn-expenditures.json public/data/normalized/tn-expenditures.json

      - name: Build
        run: npm run build

      - name: Verify Pages bundle paths
        run: |
          test -f dist/index.html
          grep -Eo \"(src|href)=\\\"[^\\\"]+\\\"\" dist/index.html || true
          grep -q \"assets/\" dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
